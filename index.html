<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Key Hub</title>
    <style>
        body { font-family: monospace; background: #0d1117; color: #c9d1d9; line-height: 1.6; padding: 40px; max-width: 1500px; margin: 0 auto; }
        h1 { color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        .columns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }
        @media (max-width: 1400px) { .columns { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 1100px) { .columns { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 800px) { .columns { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 500px) { .columns { grid-template-columns: 1fr; } }
        .column h2 { font-size: 1.1em; color: #58a6ff; margin-bottom: 10px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 20px; margin-top: 12px; }
        code { background: #000; color: #7ee787; padding: 4px 8px; border-radius: 4px; display: block; overflow-x: auto; margin: 10px 0; white-space: pre-wrap; word-break: break-all; }
        code.key-display { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
        .copy-btn { cursor: pointer; background: #238636; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; }
        .copy-btn:hover { background: #2ea043; }
        .copy-btn.copied { background: #1f6feb; }
        .footer { margin-top: 40px; font-size: 0.8em; color: #8b949e; }
    </style>
</head>
<body>

    <h1>🔑 SSH Public Keys</h1>
    <div id="keys-container"></div>

    <div class="footer">
        Generated by Cloudflare Pages • <a href="https://github.com/AhsokaTano26/pub-keys" style="color: #58a6ff;">Source Code</a>
    </div>

    <script>
        const CATEGORIES = {
            // 'label': ['type1', 'type2'],
            'Termius': ['ED25519', 'ECDSA-SK','ECDSA','RSA'],
            'tano26': ['ED25519', 'RSA'],
            'icloud': ['ED25519', 'RSA'],
            'public': ['ED25519', 'RSA'],
            'github': ['ED25519', 'RSA'],
        };

        async function loadKeys() {
            const container = document.getElementById('keys-container');
            const columns = document.createElement('div');
            columns.className = 'columns';

            for (const [label, types] of Object.entries(CATEGORIES)) {
                const col = document.createElement('div');
                col.className = 'column';
                col.innerHTML = `<h2>${label}</h2>`;

                for (const type of types) {
                    try {
                        const res = await fetch(`keys/sshid/${label}/${type}`);
                        if (!res.ok) continue;
                        const content = (await res.text()).trim();
                        if (!content) continue;

                        const card = document.createElement('div');
                        card.className = 'card';
                        const id = `key-${label}-${type.toLowerCase()}`;
                        const cmdId = `cmd-${label}-${type.toLowerCase()}`;
                        const cmd = `curl -fsSL https://key.tano.asia/keys/sshid/${label}/${type} >> ~/.ssh/authorized_keys`;
                        card.innerHTML = `<strong>${type}</strong>
<code id="${id}" class="key-display" data-full="${content.replace(/"/g, '&quot;')}">${content}</code>
<button class="copy-btn" onclick="copyText('${id}', this)">复制公钥</button>
<code id="${cmdId}" style="color:#d2a8ff;margin-top:12px">${cmd}</code>
<button class="copy-btn" onclick="copyText('${cmdId}', this)">复制命令</button>`;
                        col.appendChild(card);
                    } catch (e) {
                        console.error(`Failed to load key: ${label}/${type}`, e);
                    }
                }

                if (col.childElementCount > 1) columns.appendChild(col);
            }
            container.appendChild(columns);
        }

        function copyText(id, btn) {
            const el = document.getElementById(id);
            const text = el.dataset.full || el.innerText;
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = '已复制!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '复制公钥';
                    btn.classList.remove('copied');
                }, 1500);
            });
        }

        loadKeys();
    </script>
</body>
</html>
