<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Key Hub</title>
    <style>
        body { font-family: monospace; background: #0d1117; color: #c9d1d9; line-height: 1.6; padding: 40px; max-width: 800px; margin: 0 auto; }
        h1 { color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 20px; margin-top: 20px; }
        code { background: #000; color: #7ee787; padding: 4px 8px; border-radius: 4px; display: block; overflow-x: auto; margin: 10px 0; white-space: pre-wrap; word-break: break-all; }
        .copy-btn { cursor: pointer; background: #238636; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; }
        .copy-btn:hover { background: #2ea043; }
        .copy-btn.copied { background: #1f6feb; }
        .footer { margin-top: 40px; font-size: 0.8em; color: #8b949e; }
    </style>
</head>
<body>

    <h1>🔑 SSH Public Keys</h1>
    <div id="keys-container"></div>

    <div class="footer">
        Generated by Cloudflare Pages • <a href="https://github.com/AhsokaTano26/pub-keys" style="color: #58a6ff;">Source Code</a>
    </div>

    <script>
        const KEY_TYPES = ['ED25519', 'ECDSA-SK'];

        async function loadKeys() {
            const container = document.getElementById('keys-container');
            for (const type of KEY_TYPES) {
                try {
                    const res = await fetch(`keys/sshid/${type}`);
                    if (!res.ok) continue;
                    const content = (await res.text()).trim();
                    if (!content) continue;

                    const card = document.createElement('div');
                    card.className = 'card';
                    const id = 'key-' + type.toLowerCase();
                    card.innerHTML = `<strong>tano26 / ${type}</strong>
<code id="${id}">${content}</code>
<button class="copy-btn" onclick="copyText('${id}', this)">复制公钥</button>`;
                    container.appendChild(card);
                } catch (e) {
                    console.error(`Failed to load key: ${type}`, e);
                }
            }
        }

        function copyText(id, btn) {
            const text = document.getElementById(id).innerText;
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = '已复制!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '复制公钥';
                    btn.classList.remove('copied');
                }, 1500);
            });
        }

        loadKeys();
    </script>
</body>
</html>
